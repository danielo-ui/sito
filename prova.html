<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I miei siti</title>
<style>
  :root {
    --bg: #121212;
    --text: #f0f0f0;
    --muted: #9a9a9a;
    --line: #333333;
    --accent: #6a9bff;
  }

  [data-theme="light"] {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #dddddd;
    --accent: #2a5adf;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 4rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  main {
    width: 100%;
    max-width: 480px;
    position: relative;
  }

  #theme-toggle {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  #theme-toggle:hover, #theme-toggle:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  #theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
  }

  p.subtitle {
    color: var(--muted);
    margin: 0 0 2.5rem;
    font-size: 0.95rem;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    border-bottom: 1px solid var(--line);
  }

  li:first-child {
    border-top: 1px solid var(--line);
  }

  a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0.25rem;
    color: var(--text);
    text-decoration: none;
  }

  a:hover, a:focus-visible {
    color: var(--accent);
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .name {
    font-size: 1rem;
  }

  .desc {
    display: block;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.15rem;
  }

  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<button id="theme-toggle" aria-label="Cambia tema" title="Cambia tema">🌙</button>

<main>
  <h1>I miei siti</h1>
  <p class="subtitle">Un elenco dei progetti e delle pagine che gestisco.</p>

  <ul>
    <li>
      <a href="https://danielo-ui.github.io/seven_club/seven-club" target="_blank" rel="noopener">
        <span>
          <span class="name">Seven Club</span>
          <span class="desc">Sito per la palestra dove puoi consultare orari, posizione della palestra e contattare la reception</span>
        </span>
      </a>
    </li>
    <li>
      <a href="" target="_blank" rel="noopener"> <!--Link sito-->
        <span>
          <span class="name">Coming soon...</span>
          <span class="desc"></span>                                <!--Descrizione del sito-->
        </span>
      </a>
    </li>
    <li>
      <a href="" target="_blank" rel="noopener">                   <!--Link sito-->
        <span>
          <span class="name">Coming soon...</span>
          <span class="desc"></span>                               <!--Descrizione del sito-->
        </span>
      </a>
    </li>
  </ul>
</main>

<script>
  const toggleBtn = document.getElementById('theme-toggle');
  const root = document.documentElement;

  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const saved = localStorage.getItem('theme');
  const initialTheme = saved || (prefersLight ? 'light' : 'dark');

  function applyTheme(theme) {
    if (theme === 'light') {
      root.setAttribute('data-theme', 'light');
      toggleBtn.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      toggleBtn.textContent = '🌙';
    }
  }

  applyTheme(initialTheme);

  toggleBtn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });
</script>

</body>
</html>
